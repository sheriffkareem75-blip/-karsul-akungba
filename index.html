<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKC Connect V26 - Supabase</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding:10px}
.header{background:#0b6e0b;color:white;padding:15px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.online{color:#00ff00;font-weight:bold;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.card{background:white;padding:15px;border-radius:10px;margin:10px 0;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #ccc}
button{background:#0b6e0b;color:white;border:none;font-weight:bold;cursor:pointer}
button:hover{background:#095a09}
.tabs{display:flex;gap:5px;margin:10px 0}
.tab{flex:1;background:#ddd;color:#333;padding:10px;text-align:center;border-radius:8px;cursor:pointer}
.tab.active{background:#0b6e0b;color:white}
.hidden{display:none}
.product{border-bottom:1px solid #eee;padding:10px 0}
.badge{background:#ff9800;color:white;padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>

<div class="header">
  <div><b>AKC Connect</b><br><small>V26 Supabase</small></div>
  <div class="online">🟢 Online</div>
</div>

<div id="authSection" class="card">
  <h3>Login / Register</h3>
  <input id="phone" placeholder="Phone number e.g 080...">
  <input id="password" type="password" placeholder="Password">
  <input id="name" placeholder="Full Name (for register)">
  <select id="skill">
    <option value="">Select Skill</option>
    <option>Tailoring</option><option>Baking</option><option>Barbing</option>
    <option>Plumbing</option><option>Electrical</option><option>Others</option>
  </select>
  <button onclick="register()">Register New Account</button>
  <button onclick="login()" style="background:#2196F3">Login</button>
  <p id="authMsg"></p>
</div>

<div id="mainSection" class="hidden">
  <div class="tabs">
    <div class="tab active" onclick="showTab('home')">Home</div>
    <div class="tab" onclick="showTab('market')">🛒 Market</div>
    <div class="tab" onclick="showTab('map')">📍 Map</div>
    <div class="tab" onclick="showTab('profile')">👤 Profile</div>
  </div>

  <div id="homeTab" class="card">
    <h3>Welcome <span id="userName"></span>! 🎉</h3>
    <p>🎂 Birthdays | 🎉 Events | 📍 Location sharing active</p>
    <div class="card" style="background:#e8f5e9">
      <h4>Post Product</h4>
      <input id="pName" placeholder="Product name">
      <input id="pPrice" placeholder="Price e.g 5000">
      <select id="pCategory"><option>Food</option><option>Fashion</option><option>Services</option><option>Others</option></select>
      <button onclick="postProduct()">Post to Market</button>
    </div>
  </div>

  <div id="marketTab" class="card hidden"><h3>Marketplace</h3><div id="productList">Loading...</div></div>
  <div id="mapTab" class="card hidden"><h3>📍 Live Map</h3><p>Location sharing enabled. Users near you will appear here.</p><div id="mapList"></div></div>
  <div id="profileTab" class="card hidden"><h3>Profile</h3><div id="profileInfo"></div><button onclick="logout()" style="background:red">Logout</button></div>
</div>

<script>
// === SUPABASE CONFIG - YOUR PROJECT ===
const SUPABASE_URL = "https://frgnfoltzqmbkovtomi.supabase.co";
const SUPABASE_KEY = "sb_publishable_4q0pM7yTQYwB2P6G8YtKfH1J2LmNp3Qr4StUv5Wx6Yz7Aa8Bb9Cc0Dd1Ee2Ff3Gg4Hh5Ii6Jj7Kk8Ll9Mm0Nn1Oo2Pp3Qq4Rr5Ss6Tt7Uu8Vv9Ww0Xx1Yy2Zz3";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

// REGISTER
async function register(){
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value.trim();
  const name = document.getElementById('name').value.trim();
  const skill = document.getElementById('skill').value;
  if(!phone||!password||!name){document.getElementById('authMsg').innerText="Fill all fields";return;}
  document.getElementById('authMsg').innerText="Registering...";
  const {data,error} = await supabaseClient.from('akc_users').insert([{
    id: Date.now().toString(),
    phone: phone,
    name: name,
    password: password,
    skill: skill,
    is_owner: false,
    wallet: 0,
    live_location: {lat: 5.0, lng: 7.9}
  }]).select();
  if(error){document.getElementById('authMsg').innerText="Error: "+error.message;}
  else{document.getElementById('authMsg').innerText="Registered! Now click Login";}
}

// LOGIN
async function login(){
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value.trim();
  document.getElementById('authMsg').innerText="Logging in...";
  const {data,error} = await supabaseClient.from('akc_users').select('*').eq('phone',phone).eq('password',password);
  if(error||!data||data.length==0){document.getElementById('authMsg').innerText="Login failed. Check phone/password";}
  else{
    currentUser = data[0];
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('mainSection').classList.remove('hidden');
    document.getElementById('userName').innerText = currentUser.name;
    document.getElementById('profileInfo').innerHTML = `<p><b>Name:</b> ${currentUser.name}</p><p><b>Phone:</b> ${currentUser.phone}</p><p><b>Skill:</b> ${currentUser.skill}</p><p><b>Wallet:</b> ₦${currentUser.wallet}</p>`;
    loadProducts();
    loadUsers();
  }
}

function showTab(t){
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('homeTab').classList.add('hidden');
  document.getElementById('marketTab').classList.add('hidden');
  document.getElementById('mapTab').classList.add('hidden');
  document.getElementById('profileTab').classList.add('hidden');
  if(t=='home'){document.getElementById('homeTab').classList.remove('hidden');}
  if(t=='market'){document.getElementById('marketTab').classList.remove('hidden');loadProducts();}
  if(t=='map'){document.getElementById('mapTab').classList.remove('hidden');}
  if(t=='profile'){document.getElementById('profileTab').classList.remove('hidden');}
  event.target.classList.add('active');
}

async function postProduct(){
  const name = document.getElementById('pName').value;
  const price = document.getElementById('pPrice').value;
  const cat = document.getElementById('pCategory').value;
  if(!name||!price){alert("Fill product name and price");return;}
  const {error} = await supabaseClient.from('akc_products').insert([{
    id: Date.now().toString(),
    name: name,
    price: price,
    category: cat,
    seller_phone: currentUser.phone,
    seller_name: currentUser.name
  }]);
  if(error)alert(error.message); else {alert("Product posted!"); document.getElementById('pName').value=""; document.getElementById('pPrice').value=""; loadProducts();}
}

async function loadProducts(){
  const {data} = await supabaseClient.from('akc_products').select('*').order('created_at',{ascending:false});
  let html="";
  if(data) data.forEach(p=>{html+=`<div class="product"><b>${p.name}</b> <span class="badge">${p.category}</span><br>₦${p.price} - by ${p.seller_name} (${p.seller_phone})</div>`;});
  document.getElementById('productList').innerHTML = html||"No products yet";
}

async function loadUsers(){
  const {data} = await supabaseClient.from('akc_users').select('*').limit(20);
  let html="";
  if(data) data.forEach(u=>{html+=`<div class="product">👤 ${u.name} - ${u.skill} - ${u.phone}</div>`;});
  document.getElementById('mapList').innerHTML = html;
}

function logout(){ location.reload(); }
</script>
</body>
</html>
