<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKC V36.1 Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f6f7fb}
.header{background:#0a1931;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.logo{background:white;color:#0a1931;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.owner-badge{background:#f9c74f;color:#333;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.card{background:white;margin:10px;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.user-card{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.avatar{width:50px;height:50px;border-radius:50%;background:#1a3a8f;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
.btn{padding:8px 15px;border-radius:20px;border:none;font-weight:bold;margin-top:5px}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc}
button.primary{background:#0a1931;color:white;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;gap:10px;align-items:center"><div class="logo">K</div><div><b>AKC V36 <span class="owner-badge">OWNER</span></b><br><small id="userCount">Loading...</small></div></div>
<div><small id="currentName">Kareem Sheriff</small> <button onclick="logout()" style="width:auto;padding:5px 10px;border-radius:10px;background:white;color:#0a1931;border:none;font-size:11px">Logout</button></div>
</div>

<div id="authSection" class="card">
<h3>Login / Register - V36.1 Supabase FIXED</h3>
<input id="phone" placeholder="Phone" value="08105986759">
<input id="password" type="password" placeholder="Password">
<input id="name" placeholder="Full Name" value="Kareem Sheriff">
<select id="skill"><option>Plumbing</option><option>Phone Repair</option><option>Gadgets</option></select>
<button class="primary" onclick="registerDirect()">Register New Account</button>
<button class="primary" style="background:#0984e3" onclick="loginDirect()">Login</button>
<p id="msg" style="color:red;margin-top:10px"></p>
<p style="font-size:12px;color:green">🟢 Supabase Direct Mode</p>
</div>

<div id="mainSection" class="hidden">
<div class="card"><b>Registered - <span id="regCount">0</span> | <span id="onlineCount">1 Online</span></b><div id="usersList" style="margin-top:10px">Loading...</div></div>
<div style="height:60px"></div>
</div>

<script>
const URL = "https://frgnfoltzqmbkovtomi.supabase.co/rest/v1/akc_users";
const KEY = "sb_publishable_4q0pM7yTQYwB2P6G8YtKfH1J2LmNp3Qr4StUv5Wx6Yz7Aa8Bb9Cc0Dd1Ee2Ff3Gg4Hh5Ii6Jj7Mm0Nn1Oo2Pp3Qq4Rr5Ss6Tt7Uu8Vv9Ww0Xx1Yy2Zz3";
let currentUser=null;

async function registerDirect(){
  const phone=document.getElementById('phone').value.trim();
  const pass=document.getElementById('password').value.trim();
  const name=document.getElementById('name').value.trim();
  const skill=document.getElementById('skill').value;
  if(!phone||!pass||!name){msg.innerText="Fill all";return;}
  msg.innerText="Registering via Direct API...";
  try{
    const res = await fetch(URL,{
      method:"POST",
      headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Prefer":"return=representation"},
      body: JSON.stringify({id:Date.now().toString(),phone,name,password:pass,skill,is_owner:phone==='08105986759',wallet:0})
    });
    const data = await res.json();
    if(!res.ok){msg.innerText="Error: "+JSON.stringify(data);return;}
    msg.innerText="✅ Registered! Now click Login";
  }catch(e){msg.innerText="Fetch Error: "+e.message+" - Check internet";}
}

async function loginDirect(){
  const phone=document.getElementById('phone').value.trim();
  const pass=document.getElementById('password').value.trim();
  msg.innerText="Logging in...";
  try{
    const res = await fetch(`${URL}?phone=eq.${phone}&password=eq.${pass}`,{
      headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}
    });
    const data = await res.json();
    if(!data||data.length===0){msg.innerText="Login failed - no user found. Register first!";return;}
    currentUser=data[0];
    authSection.classList.add('hidden');
    mainSection.classList.remove('hidden');
    currentName.innerText=currentUser.name;
    loadUsersDirect();
  }catch(e){msg.innerText="Login Fetch Error: "+e.message;}
}

async function loadUsersDirect(){
  try{
    const res = await fetch(`${URL}?select=*`,{headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}});
    const data = await res.json();
    if(!data) return;
    regCount.innerText=data.length;
    userCount.innerText=data.length+" Users";
    let html="";
    data.forEach(u=>{
      html+=`<div class="user-card"><div class="avatar">${u.name.charAt(0)}</div><div><b>${u.name}</b> - ${u.skill}<br><small>${u.phone}</small></div></div>`;
    });
    usersList.innerHTML=html;
  }catch(e){usersList.innerHTML="Error loading: "+e.message;}
}
function logout(){location.reload()}
</script>
</body>
</html>
