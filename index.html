<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KAC - KARSUL AKUNGBA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f5f7;color:#111;padding-bottom:90px}
.top{position:sticky;top:0;background:#111;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.top b{font-size:16px}
.top small{font-size:11px;opacity:.9}
.badge{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700}
.bAdmin{background:gold;color:#111}
.bLive{background:#00c853;color:#fff}
.card{background:#fff;border-radius:14px;padding:12px;margin:10px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.row{display:flex;gap:8px}
.inp{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:14px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.btnGold{background:linear-gradient(90deg,#ffb300,#ff8f00);color:#111}
.small{font-size:11px;color:#666}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #eee;z-index:20}
.tab{flex:1;padding:10px 2px;text-align:center;font-size:11px;cursor:pointer;color:#666}
.tab.act{color:#111;font-weight:800;border-top:2px solid #111}
.hide{display:none}
.avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#ddd;border:1px solid #eee}
.topAvatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.chatBox{height:42vh;overflow-y:auto;border:1px solid #eee;border-radius:10px;padding:8px;background:#fafafa}
.msg{display:flex;gap:6px;margin:6px 0;align-items:flex-start}
.msg .bubble{background:#fff;padding:8px 10px;border-radius:12px;max-width:78%;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{background:#111;color:#fff}
.liveDot{width:8px;height:8px;background:#00c853;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
video{width:100%;border-radius:12px;background:#000}
</style>
</head>
<body>

<div class="top">
<div style="display:flex;align-items:center;gap:8px">
<img id="topAvatar" class="topAvatar hide" src="">
<div><b>KAC</b><br><small id="topName">KARSUL AKUNGBA</small></div>
</div>
<div id="topBadge"></div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="card" style="margin-top:20px">
<h3 style="text-align:center">KAC Login - Facial Verification</h3>
<p class="small" style="text-align:center;margin:6px 0">Your face = Your Avatar 👤</p>
<input id="lName" class="inp" placeholder="Full Name">
<input id="lPhone" class="inp" placeholder="Phone e.g 081...">
<select id="lDept" class="inp">
<option value="">Select Dept - All Faculties</option>
<option>Accounting</option><option>Business Admin</option><option>Banking & Finance</option>
<option>Economics</option><option>Political Science</option><option>Mass Comm</option>
<option>Computer Science</option><option>Geology</option><option>Microbiology</option><option>Chemistry</option><option>Physics</option><option>Biochemistry</option>
<option>English</option><option>History</option><option>Yoruba</option><option>Philosophy</option>
<option>Law</option><option>Criminology</option>
<option>Education</option><option>Guidance & Counselling</option>
</select>
<input id="lLoc" class="inp" placeholder="Location e.g Akungba, Akoko">

<video id="vid" autoplay playsinline class="hide"></video>
<canvas id="can" class="hide"></canvas>
<img id="facePreview" class="hide" style="width:100px;height:100px;border-radius:50%;margin:10px auto;display:block;object-fit:cover;border:3px solid #111">

<button id="startFace" class="btn" style="background:#222;margin-top:8px" onclick="startFace()">📸 Start Facial Scan</button>
<button id="capFace" class="btn hide" style="background:#00c853;margin-top:8px" onclick="capFace()">✅ Capture My Avatar</button>

<!-- SECRET ADMIN FIELD - HIDDEN -->
<input id="adminCode" type="password" placeholder="" style="display:none">
<div id="secretTrigger" style="text-align:center;margin:10px 0;font-size:10px;color:#888;cursor:pointer;user-select:none;padding:6px;border:1px dashed #ddd;border-radius:20px" onclick="this._c=(this._c||0)+1; if(this._c>=5){document.getElementById('adminCode').style.display='block';document.getElementById('adminCode').placeholder='Enter Access'; this.innerText='🔓 Access unlocked'; this.style.color='#111'; this.style.borderColor='#111'}">KAC Secure v1.0 - Tap 5x for admin</div>

<button class="btn" onclick="doLogin()" style="margin-top:8px">ENTER KAC →</button>
<p id="lErr" class="small" style="color:red;text-align:center;margin-top:6px"></p>
</div>

<!-- MAIN APP -->
<div id="app" class="hide">

<!-- BUY -->
<div id="pBuy" class="page">
<div class="card">
<div class="row">
<input id="sQ" class="inp" placeholder="Search items..." oninput="renderBuy()">
<select id="sDept" class="inp" style="max-width:130px" onchange="renderBuy()"><option value="">All Depts</option><option>Accounting</option><option>Computer Science</option></select>
</div>
</div>
<div id="adTop"></div>
<div id="buyList"></div>
</div>

<!-- SELL -->
<div id="pSell" class="page hide">
<div class="card">
<h4>Post Item to Sell</h4>
<input id="sellTitle" class="inp" placeholder="Item title e.g iPhone 11">
<input id="sellPrice" class="inp" type="number" placeholder="Price ₦">
<textarea id="sellDesc" class="inp" placeholder="Description + location"></textarea>
<button class="btn" onclick="postSell()">Post Sell - Earn ₦100 Rank</button>
</div>
</div>

<!-- CHAT - LIVE CHAT + AVATAR -->
<div id="pChat" class="page hide">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<b>Live Chat <span class="liveDot"></span> <small id="liveInfo">Connecting...</small></b>
<select id="chatDept" class="inp" style="width:120px;padding:6px" onchange="renderChat()"><option value="">General</option><option>Computer Science</option></select>
</div>
<div id="chatBox" class="chatBox"></div>
<div class="row" style="margin-top:8px">
<input id="chatInp" class="inp" placeholder="Type message... your avatar go show">
<button class="btn" style="width:80px" onclick="sendChat()">Send</button>
</div>
</div>
</div>

<!-- ADVERT -->
<div id="pAdvert" class="page hide">
<div class="card" id="advertAdminBox">
<h4>Adverts</h4>
<div id="adminAdForm" class="hide">
<input id="adTitle" class="inp" placeholder="Advert Title">
<textarea id="adBody" class="inp" placeholder="Advert Details"></textarea>
<button class="btn btnGold" onclick="postAd()">👑 Post Advert (Admin)</button>
</div>
