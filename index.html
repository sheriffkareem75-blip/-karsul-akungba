<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARSUL AKUNGBA - 1-IN-6</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f5f5f0}
.top{background:#000;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:gold}.live{font-size:10px;background:green;padding:2px 6px;border-radius:10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:8px 0;z-index:10}
.btab{color:#777;text-align:center;font-size:11px;flex:1}.btab.active{color:gold}
.screen{padding:12px;padding-bottom:80px;display:none}.screen.active{display:block}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.btn{background:#000;color:gold;border:none;padding:10px 16px;border-radius:20px;font-weight:700;width:100%}
.dept{padding:10px;background:#fff;margin:4px;border-radius:8px;display:flex;justify-content:space-between}
.chatbox{height:50vh;overflow-y:auto;background:#fff;border-radius:10px;padding:10px;margin:10px 0}
.msg{margin:6px 0;padding:8px 12px;border-radius:12px;max-width:80%}.me{background:#000;color:gold;margin-left:auto}.other{background:#eee}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc}
.ad{background:linear-gradient(90deg,gold,#000);color:#fff;padding:12px;border-radius:10px;margin-bottom:10px}
</style></head>
<body>
<div class="top"><div class="logo">KAC - KARSUL AKUNGBA</div><div><span id="uName">Hi</span> <span class="live" id="liveLoc">📍 LIVE</span></div></div>

<div id="loginScreen" style="padding:20px;display:flex;flex-direction:column;justify-content:center;height:100vh;background:#000">
<h1 style="color:gold;text-align:center">KAC</h1><p style="color:#fff;text-align:center">1-IN-6 APP</p>
<div class="card" style="margin-top:20px">
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone/WhatsApp">
<select id="deptSel"><option value="">Select Department</option><option>Accounting</option><option>Business Administration</option><option>Economics</option><option>Mass Communication</option><option>Computer Science</option><option>Political Science</option><option>AAUA General</option></select>
<select id="locSel"><option value="">Location</option><option>Ibaka</option><option>Supare</option><option>Akungba</option><option>AAUA Gate</option><option>Permanent Site</option></select>
<input id="adminCode" placeholder="Admin Code (leave if student)">
<button class="btn" onclick="login()">ENTER KAC - 1 IN 6</button>
</div></div>

<div id="app" style="display:none">
<!-- BUY -->
<div id="sBUY" class="screen active"><div id="adBanner"></div><h3>Market - Buy</h3><div id="buyGrid"></div></div>
<!-- SELL -->
<div id="sSELL" class="screen"><h3>Sell - Post Your Hustle</h3><div class="card"><input id="pTitle" placeholder="What you dey sell?"><input id="pPrice" placeholder="Price"><select id="pCat"><option>Tailoring</option><option>Barbing</option><option>Plumbing</option><option>Tech Repair</option><option>Food</option><option>Lodge</option></select><textarea id="pDesc" placeholder="Description + WhatsApp number"></textarea><button class="btn" onclick="postProduct()">Post Now</button></div></div>
<!-- CHAT -->
<div id="sCHAT" class="screen"><h3>Department Chat</h3><div id="deptList"></div><div id="chatArea" style="display:none"><button onclick="backDept()">← Back to Departments</button><h4 id="curDept"></h4><div id="chatBox" class="chatbox"></div><div style="display:flex"><input id="chatIn" placeholder="Type message..."><button onclick="sendChat()" style="padding:12px;background:gold">Send</button></div></div></div>
<!-- ADVERT -->
<div id="sADVERT" class="screen"><h3>Adverts</h3><div id="adminPost" style="display:none" class="card"><h4>Admin - Post Add</h4><input id="adTitle" placeholder="Advert Title"><textarea id="adDesc" placeholder="Advert Details"></textarea><button class="btn" onclick="postAd()">Post Advert (Admin Only)</button></div><div id="adsList"></div></div>
<!-- WALLET -->
<div id="sWALLET" class="screen"><h3>Wallet</h3><div class="card"><h1 id="bal">₦0</h1><p>Sales Balance</p><p id="liveCoord">📍 Fetching live location...</p><button class="btn" onclick="getLive()">Update Live Location Now</button></div></div>
<!-- SET -->
<div id="sSET" class="screen"><h3>Settings</h3><div class="card"><p id="setInfo"></p><button class="btn" style="background:red;color:#fff" onclick="logout()">Logout</button></div></div>

<div class="bottom">
<div class="btab active" onclick="tab('BUY')">BUY<br>🛒</div>
<div class="btab" onclick="tab('SELL')">SELL<br>📤</div>
<div class="btab" onclick="tab('CHAT')">CHAT<br>💬</div>
<div class="btab" onclick="tab('ADVERT')">ADVERT<br>📢</div>
<div class="btab" onclick="tab('WALLET')">WALLET<br>💰</div>
<div class="btab" onclick="tab('SET')">SET<br>⚙️</div>
</div>
</div>

<script>
let curUser=JSON.parse(localStorage.getItem('kacUser')||'null');
let products=JSON.parse(localStorage.getItem('kacProd')||'[]');
let ads=JSON.parse(localStorage.getItem('kacAds')||'[]');
let chats=JSON.parse(localStorage.getItem('kacChat')||'{}');
let curDeptName=''; let isAdmin=false;
const depts=["Accounting","Business Administration","Economics","Mass Communication","Computer Science","Political Science","AAUA General"];
function init(){if(curUser){showApp();} getLive();}
function login(){
 let n=document.getElementById('name').value, ph=document.getElementById('phone').value, d=document.getElementById('deptSel').value, l=document.getElementById('locSel').value, code=document.getElementById('adminCode').value;
 if(!n||!d||!l) return alert('Fill name, dept, location');
 isAdmin=code==='KAC2024';
 curUser={name:n,phone:ph,dept:d,loc:l,isAdmin:isAdmin,lat:null,lng:null};
 localStorage.setItem('kacUser',JSON.stringify(curUser)); showApp();
}
function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';document.getElementById('uName').innerText='Hi, '+curUser.name+' - '+curUser.loc;document.getElementById('setInfo').innerText=curUser.name+' | '+curUser.dept+' | '+curUser.loc+' | '+(curUser.isAdmin?'ADMIN':'Student');if(curUser.isAdmin)document.getElementById('adminPost').style.display='block';renderBuy();renderDepts();renderAds();getLive();}
function tab(t){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('s'+t).classList.add('active');document.querySelectorAll('.btab').forEach(b=>b.classList.remove('active'));event.currentTarget.classList.add('active');if(t==='BUY')renderBuy();if(t==='ADVERT')renderAds();}
function postProduct(){let p={title:document.getElementById('pTitle').value,price:document.getElementById('pPrice').value,cat:document.getElementById('pCat').value,desc:document.getElementById('pDesc').value,owner:curUser.name,loc:curUser.loc,dept:curUser.dept,lat:curUser.lat,lng:curUser.lng};products.unshift(p);localStorage.setItem('kacProd',JSON.stringify(products));alert('Posted! Go to BUY');tab('BUY');}
function renderBuy(){let g=document.getElementById('buyGrid');if(products.length==0)g.innerHTML='<div class="card">No products yet - Be first to sell!</div>';else g.innerHTML=products.map(p=>`<div class="card"><b>${p.title} - ${p.cat}</b><p>₦${p.price}</p><p>${p.desc}</p><p>📍 ${p.loc} ${p.lat?'• LIVE '+p.lat.toFixed(3):''} • ${p.owner} • ${p.dept}</p><button class="btn" onclick="window.open('https://wa.me/${p.desc.match(/\\d+/)?p.desc.match(/\\d+/)[0]:''}?text=Hi I see ${p.title} on KAC','_blank')">Chat Seller + Share My Live Location</button></div>`).join('');}
function renderDepts(){document.getElementById('deptList').innerHTML=depts.map(d=>`<div class="dept" onclick="openDept('${d}')"><span>${d}</span><span>💬 ${(chats[d]||[]).length}</span></div>`).join('');}
function openDept(d){curDeptName=d;document.getElementById('deptList').style.display='none';document.getElementById('chatArea').style.display='block';document.getElementById('curDept').innerText=d+' Department Chat - Live';renderChat();}
function backDept(){document.getElementById('deptList').style.display='block';document.getElementById('chatArea').style.display='none';}
function renderChat(){let box=document.getElementById('chatBox');let list=chats[curDeptName]||[];box.innerHTML=list.map(m=>`<div class="msg ${m.name==curUser.name?'me':'other'}"><b>${m.name} (${m.loc})</b><br>${m.text}<br><small>${m.time} ${m.lat?'📍 LIVE':''}</small></div>`).join('');box.scrollTop=box.scrollHeight;}
function sendChat(){let t=document.getElementById('chatIn').value;if(!t)return;if(!chats[curDeptName])chats[curDeptName]=[];chats[curDeptName].push({name:curUser.name,loc:curUser.loc,text:t,time:new Date().toLocaleTimeString(),lat:curUser.lat,lng:curUser.lng});localStorage.setItem('kacChat',JSON.stringify(chats));document.getElementById('chatIn').value='';renderChat();renderDepts();}
function postAd(){if(!curUser.isAdmin)return alert('Admin only');let a={title:document.getElementById('adTitle').value,desc:document.getElementById('adDesc').value,time:new Date().toLocaleString()};ads.unshift(a);localStorage.setItem('kacAds',JSON.stringify(ads));renderAds();alert('Ad posted!');}
function renderAds(){let html=ads.map(a=>`<div class="ad"><b>${a.title}</b><p>${a.desc}</p><small>${a.time} - ADMIN</small></div>`).join('');document.getElementById('adsList').innerHTML=html||'<div class="card">No adverts yet</div>';document.getElementById('adBanner').innerHTML=ads[0]?`<div class="ad"><b>📢 ${ads[0].title}</b> - ${ads[0].desc}</div>`:'';}
function getLive(){if(!navigator.geolocation){document.getElementById('liveCoord').innerText='Live location not supported';return;}navigator.geolocation.getCurrentPosition(p=>{if(curUser){curUser.lat=p.coords.latitude;curUser.lng=p.coords.longitude;localStorage.setItem('kacUser',JSON.stringify(curUser));}document.getElementById('liveLoc').innerText='📍 '+p.coords.latitude.toFixed(2)+','+p.coords.longitude.toFixed(2);document.getElementById('liveCoord').innerText='📍 LIVE: '+p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5)+' - Akungba';},()=>{document.getElementById('liveLoc').innerText='📍 OFF';});}
function logout(){localStorage.removeItem('kacUser');location.reload();}
init();
</script></body></html>
