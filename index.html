<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARSUL AKUNGBA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f0f0f;color:#fff}
.landing{padding:30px 20px;text-align:center}
.landing h1{font-size:38px;color:#ffcc00}
.btn{padding:12px 24px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn-yellow{background:#ffcc00;color:#000}
.btn-dark{background:#222;color:#fff;border:1px solid #333}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:900px;margin:20px auto}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:10px}
.card img{width:100%;height:120px;object-fit:cover;border-radius:8px;background:#222}
.card h3{font-size:13px;margin:6px 0}
.price{color:#ffcc00;font-weight:800}
#adminPanel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0f0f0f;overflow:auto;padding:15px;z-index:99}
.input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;margin:5px 0}
.order-box{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:8px}
.small{font-size:11px;color:#aaa}
.tab{display:inline-block;padding:8px 14px;background:#222;border-radius:20px;margin:5px;cursor:pointer}
.tab.active{background:#ffcc00;color:#000}
.section{display:none}
.section.active{display:block}
</style>
</head>
<body>
<div class="landing">
<h1>KARSUL AKUNGBA</h1>
<p style="color:#aaa">Premium Quality - Fast Delivery - 08105986759</p>
<div id="products" class="products"></div>
<p onclick="showAdmin()" style="margin-top:30px;color:#555;text-decoration:underline;cursor:pointer">Admin Login</p>
</div>
<div id="adminPanel">
<div style="display:flex;justify-content:space-between">
<h2 style="color:#ffcc00">ADMIN</h2>
<button class="btn btn-dark" onclick="hideAdmin()">X Close</button>
</div>
<div id="loginBox" style="text-align:center;margin-top:60px">
<input id="passInput" type="password" placeholder="893000" style="padding:12px;width:240px;border-radius:8px;text-align:center">
<br><br>
<button class="btn btn-yellow" onclick="checkPass()">Unlock</button>
<p class="small">Password: 893000 - WA: 08105986759</p>
</div>
<div id="dashBox" style="display:none">
<div>
<span class="tab active" id="t1" onclick="showTab('productsTab','t1')">Products</span>
<span class="tab" id="t2" onclick="showTab('ordersTab','t2')">Orders <span id="orderCount"></span></span>
<span class="tab" id="t3" onclick="showTab('chatTab','t3')">Chats</span>
</div>
<div id="productsTab" class="section active">
<h3>Add Product</h3>
<input id="pName" class="input" placeholder="Name">
<input id="pPrice" class="input" placeholder="Price" type="number">
<input id="pImg" class="input" placeholder="Image URL">
<button class="btn btn-yellow" style="width:100%;margin-top:8px" onclick="addProduct()">Add Product</button>
<div id="adminProducts" style="margin-top:15px"></div>
</div>
<div id="ordersTab" class="section">
<h3>Live Orders - 08105986759</h3>
<div id="ordersList"></div>
</div>
<div id="chatTab" class="section">
<h3>Chats</h3>
<div id="chatList"></div>
</div>
</div>
</div>
<script>
var PRODUCTS = JSON.parse(localStorage.getItem('karsul_products')||'[]');
if(PRODUCTS.length==0){
PRODUCTS=[{id:1,name:'Premium Slides',price:12000,img:'https://via.placeholder.com/300'},{id:2,name:'Karsul Cap',price:5000,img:'https://via.placeholder.com/300'}];
localStorage.setItem('karsul_products',JSON.stringify(PRODUCTS));
}
var ORDERS = JSON.parse(localStorage.getItem('karsul_orders')||'[]');
var CHATS = JSON.parse(localStorage.getItem('karsul_chats')||'[]');
var ADMIN_PASS='893000';
function saveProducts(){localStorage.setItem('karsul_products',JSON.stringify(PRODUCTS))}
function renderProducts(){
var c=document.getElementById('products');
var h='';
for(var i=0;i<PRODUCTS.length;i++){
var p=PRODUCTS[i];
h+='<div class="card"><img src="'+p.img+'"><h3>'+p.name+'</h3><div class="price">N'+p.price+'</div><button class="btn btn-yellow" style="width:100%;margin-top:6px;padding:6px" onclick="orderProduct('+p.id+')">Order Now</button></div>';
}
c.innerHTML=h;
renderAdminProducts();
}
function renderAdminProducts(){
var c=document.getElementById('adminProducts');
var h='';
for(var i=0;i<PRODUCTS.length;i++){
var p=PRODUCTS[i];
h+='<div class="order-box"><b>'+p.name+'</b> - N'+p.price+' <button class="btn btn-dark" style="float:right;padding:4px 10px" onclick="deleteProduct('+p.id+')">Del</button></div>';
}
c.innerHTML=h;
}
function addProduct(){
var name=document.getElementById('pName').value;
var price=document.getElementById('pPrice').value;
var img=document.getElementById('pImg').value;
if(!img){img='https://via.placeholder.com/300';}
if(!name||!price){alert('Enter name and price');return;}
PRODUCTS.unshift({id:Date.now(),name:name,price:price,img:img});
saveProducts();
renderProducts();
document.getElementById('pName').value='';
document.getElementById('pPrice').value='';
document.getElementById('pImg').value='';
alert('Added');
}
function deleteProduct(id){
var n=[];
for(var i=0;i<PRODUCTS.length;i++){if(PRODUCTS[i].id!=id){n.push(PRODUCTS[i])}}
PRODUCTS=n;
saveProducts();
renderProducts();
}
function orderProduct(id){
var p=null;
for(var i=0;i<PRODUCTS.length;i++){if(PRODUCTS[i].id==id){p=PRODUCTS[i]}}
var cname=prompt('Your Name:');
if(!cname)return;
var phone=prompt('Phone:');
if(!phone)return;
var addr=prompt('Address:');
var order={id:Date.now(),product:p.name,price:p.price,customer:cname,phone:phone,address:addr,time:new Date().toLocaleString()};
ORDERS.unshift(order);
localStorage.setItem('karsul_orders',JSON.stringify(ORDERS));
alert('Order Placed! We will call you - 08105986759');
renderOrders();
}
function renderOrders(){
var c=document.getElementById('ordersList');
var count=document.getElementById('orderCount');
if(count){count.innerHTML=ORDERS.length>0?'('+ORDERS.length+')':'';}
if(!c)return;
if(ORDERS.length==0){c.innerHTML='<p class="small">No orders yet</p>';return;}
var h='';
for(var i=0;i<ORDERS.length;i++){
var o=ORDERS[i];
h+='<div class="order-box"><b>'+o.product+'</b> - N'+o.price+'<br><span class="small">'+o.customer+' | '+o.phone+'<br>'+o.address+'<br>'+o.time+'</span><br><button class="btn btn-dark" style="margin-top:6px;padding:5px 10px" onclick="deleteOrder('+o.id+')">Done</button> <a href="https://wa.me/2348105986759?text=Order" target="_blank" style="color:#ffcc00;font-size:12px">WhatsApp</a></div>';
}
c.innerHTML=h;
}
function deleteOrder(id){
var n=[];
for(var i=0;i<ORDERS.length;i++){if(ORDERS[i].id!=id){n.push(ORDERS[i])}}
ORDERS=n;
localStorage.setItem('karsul_orders',JSON.stringify(ORDERS));
renderOrders();
}
function renderChats(){
var c=document.getElementById('chatList');
if(!c)return;
if(CHATS.length==0){c.innerHTML='<p class="small">No chats yet</p>';return;}
var h='';
for(var i=0;i<CHATS.length;i++){h+='<div class="order-box">'+CHATS[i].name+'<br><span class="small">'+CHATS[i].msg+'</span></div>';}
c.innerHTML=h;
}
function showAdmin(){document.getElementById('adminPanel').style.display='block';}
function hideAdmin(){document.getElementById('adminPanel').style.display='none';}
function checkPass(){
var v=document.getElementById('passInput').value;
if(v==ADMIN_PASS){document.getElementById('loginBox').style.display='none';document.getElementById('dashBox').style.display='block';renderOrders();renderChats();}
else{alert('Wrong password');}
}
function showTab(tabId,btnId){
var secs=document.getElementsByClassName('section');
for(var i=0;i<secs.length;i++){secs[i].classList.remove('active');}
document.getElementById(tabId).classList.add('active');
var tabs=document.getElementsByClassName('tab');
for(var i=0;i<tabs.length;i++){tabs[i].classList.remove('active');}
document.getElementById(btnId).classList.add('active');
if(tabId=='ordersTab'){renderOrders();}
if(tabId=='chatTab'){renderChats();}
}
renderProducts();
renderOrders();
</script>
</body>
</html>
