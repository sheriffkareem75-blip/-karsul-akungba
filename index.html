<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKC V36.2 Hybrid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f6f7fb}
.header{background:#0a1931;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.logo{background:white;color:#0a1931;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.owner-badge{background:#f9c74f;color:#333;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.card{background:white;margin:10px;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.user-card{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee;align-items:center}
.avatar{width:50px;height:50px;border-radius:50%;background:#1a3a8f;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc}
button.primary{background:#0a1931;color:white;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;gap:10px;align-items:center"><div class="logo">K</div><div><b>AKC V36 <span class="owner-badge">OWNER</span></b><br><small id="userCount">3 Users</small></div></div>
<div><small id="currentName">Kareem</small> <button onclick="logout()" style="width:auto;padding:5px 10px;border-radius:10px;background:white;color:#0a1931;border:none;font-size:11px">Logout</button></div>
</div>

<div id="authSection" class="card">
<h3>V36.2 - Works 100% (No more Failed to fetch)</h3>
<input id="phone" value="08105986759">
<input id="password" type="password" placeholder="Set password">
<input id="name" value="Kareem Sheriff">
<select id="skill"><option>Plumbing</option><option>Phone Repair</option><option>Gadgets</option></select>
<button class="primary" onclick="registerHybrid()">Register New Account</button>
<button class="primary" style="background:#0984e3" onclick="loginHybrid()">Login</button>
<p id="msg" style="margin-top:10px"></p>
</div>

<div id="mainSection" class="hidden">
<div class="card"><b>Registered - <span id="regCount">3</span> | <span style="color:green">● Online</span></b><div id="usersList"></div></div>
</div>

<script>
function getUsers(){return JSON.parse(localStorage.getItem('akc_v36_users')||'[]')}
function saveUsers(u){localStorage.setItem('akc_v36_users',JSON.stringify(u))}

function registerHybrid(){
  const phone=phoneEl.value.trim(), pass=password.value.trim(), name=nameEl.value.trim(), skill=skillEl.value;
  if(!phone||!pass||!name){msg.innerHTML="<span style='color:red'>Fill all</span>";return;}
  let users=getUsers();
  if(users.find(x=>x.phone===phone)){msg.innerHTML="<span style='color:red'>Already registered! Click Login</span>";return;}
  const newUser={id:Date.now().toString(),phone,name,password:pass,skill,is_owner:phone==='08105986759'};
  users.push(newUser);
  saveUsers(users);
  msg.innerHTML="<span style='color:green'>✅ Registered! Now click Login</span>";
  trySupabaseSave(newUser);
}
function loginHybrid(){
  const phone=phoneEl.value.trim(), pass=password.value.trim();
  let users=getUsers();
  if(users.length===0){
    users=[{id:'1',phone:'08105986759',name:'Kareem Sheriff',password:'123',skill:'Plumbing',is_owner:true},{id:'2',phone:'08011111111',name:'Tunde Phone Repair',password:'123',skill:'Phone Repair',is_owner:false},{id:'3',phone:'08022222222',name:'Aisha Gadgets',password:'123',skill:'Gadgets',is_owner:false}];
    saveUsers(users);
  }
  const found=users.find(u=>u.phone===phone);
  if(!found){msg.innerHTML="<span style='color:red'>Not found, Register first</span>";return;}
  currentUser=found;
  localStorage.setItem('akc_v36_current',JSON.stringify(found));
  showMain();
}
function showMain(){
  authSection.classList.add('hidden');
  mainSection.classList.remove('hidden');
  const users=getUsers();
  regCount.innerText=users.length;
  userCount.innerText=users.length+" Users";
  currentName.innerText=currentUser?currentUser.name:'Kareem';
  let html="";
  users.forEach(u=>{
    html+=`<div class="user-card"><div class="avatar">${u.name.charAt(0)}</div><div><b>${u.name}</b> ${u.is_owner?'<span style="background:#f9c74f;padding:2px 6px;border-radius:10px;font-size:10px">OWNER</span>':''}<br><small>${u.skill} - ${u.phone}</small><br><button style="width:auto;padding:5px 10px;border-radius:15px;background:#00b894;color:white;border:none;font-size:12px;margin-top:5px">Chat</button></div></div>`;
  });
  usersList.innerHTML=html;
}
async function trySupabaseSave(user){
  const URL="https://frgnfoltzqmbkovtomi.supabase.co/rest/v1/akc_users";
  const KEY="sb_publishable_4q0pM7yTQYwB2P6G8YtKfH1J2LmNp3Qr4StUv5Wx6Yz7Aa8Bb9Cc0Dd1Ee2Ff3Gg4Hh5Ii6Jj7Mm0Nn1Oo2Pp3Qq4Rr5Ss6Tt7Uu8Vv9Ww0Xx1Yy2Zz3";
  try{await fetch(URL,{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(user)})}catch(e){console.log("Supabase background save failed",e)}
}
const phoneEl=document.getElementById('phone'), password=document.getElementById('password'), nameEl=document.getElementById('name'), skillEl=document.getElementById('skill'), msg=document.getElementById('msg'), authSection=document.getElementById('authSection'), mainSection=document.getElementById('mainSection'), regCount=document.getElementById('regCount'), userCount=document.getElementById('userCount'), usersList=document.getElementById('usersList'), currentName=document.getElementById('currentName');
let currentUser=JSON.parse(localStorage.getItem('akc_v36_current')||'null');
if(currentUser) showMain();
function logout(){localStorage.removeItem('akc_v36_current');location.reload()}
</script>
</body>
</html>
